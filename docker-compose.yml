services:
  mongodb:
    image: mongo:7
    container_name: hypha-kds-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: hypha-kds-backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/hypha-kds
      CORS_ORIGIN: http://localhost:5173
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 250
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
    container_name: hypha-kds-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    environment:
      VITE_GRAPHQL_HTTP_URL: http://localhost:4000/graphql
      VITE_GRAPHQL_WS_URL: ws://localhost:4000/graphql
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 250
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '5173:5173'

volumes:
  mongodb_data:
  backend_node_modules:
  frontend_node_modules:
